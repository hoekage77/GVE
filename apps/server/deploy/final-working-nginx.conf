# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.dosco.live;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.dosco.live;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/api.dosco.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.dosco.live/privkey.pem;
    
    # SSL optimizations
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 20m;

    # CORS headers - set once at server level
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-user-id, x-request-id" always;
    add_header Access-Control-Allow-Credentials "true" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Set CORS origin dynamically based on request
        set $cors_origin "";
        
        if ($http_origin = "https://app.dosco.live") {
            set $cors_origin $http_origin;
        }
        
        if ($http_origin ~ "^http://localhost:(3000|5173)$") {
            set $cors_origin $http_origin;
        }
        
        if ($http_origin ~ "^http://127\.0\.0\.1:(3000|5173)$") {
            set $cors_origin $http_origin;
        }
        
        # Add CORS origin header if origin is allowed
        if ($cors_origin != "") {
            add_header Access-Control-Allow-Origin $cors_origin always;
        }

        # Handle preflight OPTIONS requests
        if ($request_method = 'OPTIONS') {
            add_header Content-Length 0 always;
            add_header Content-Type text/plain always;
            return 204;
        }
    }
}