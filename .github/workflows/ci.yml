name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Server typecheck
        run: npm run typecheck --workspace=@visual-runtime/server

      - name: Server test
        run: npm run test --workspace=@visual-runtime/server

      - name: Web lint
        run: npm run lint --workspace=@visual-runtime/web

      - name: Web typecheck
        run: npm run typecheck --workspace=@visual-runtime/web

      - name: Web test
        run: npm run test --workspace=@visual-runtime/web
